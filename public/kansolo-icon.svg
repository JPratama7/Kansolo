<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kansolo">
  <defs>
    <linearGradient id="bg" x1="96" y1="32" x2="416" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#243353"/>
      <stop offset="1" stop-color="#12192B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E8"/>
      <stop offset="1" stop-color="#E8DFD2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#E85D34"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B1020" flood-opacity="0.35"/>
    </filter>
    <clipPath id="icon">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="400" cy="84" r="160" fill="#2E4570" opacity="0.22"/>
    <circle cx="96" cy="460" r="140" fill="#0A0F1C" opacity="0.35"/>

    <!-- left column -->
    <g filter="url(#soft)">
      <rect x="118" y="186" width="84" height="58" rx="14" fill="url(#card)"/>
      <rect x="118" y="260" width="84" height="58" rx="14" fill="url(#card)"/>
    </g>
    <circle cx="138" cy="296" r="5" fill="#3DB8A8"/>

    <!-- middle column -->
    <g filter="url(#soft)">
      <rect x="222" y="188" width="84" height="58" rx="14" fill="url(#card)"/>
      <rect x="222" y="262" width="84" height="58" rx="14" fill="url(#card)"/>
      <rect x="230" y="108" width="84" height="58" rx="14" fill="url(#accent)"/>
    </g>
    <rect x="246" y="130" width="36" height="6" rx="3" fill="#FFE8DC" opacity="0.85"/>
    <rect x="246" y="142" width="52" height="6" rx="3" fill="#FFE8DC" opacity="0.45"/>
    <circle cx="242" cy="224" r="5" fill="#E85D34"/>

    <!-- right column -->
    <g filter="url(#soft)">
      <rect x="326" y="262" width="84" height="58" rx="14" fill="url(#card)"/>
    </g>
  </g>
</svg>
