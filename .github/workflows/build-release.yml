name: Build Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os-label }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os-label: linux
            arch: x86_64
          - runner: macos-13
            os-label: macos
            arch: x86_64
          - runner: macos-latest
            os-label: macos
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (binary + bundles)
        run: make bundle

      - name: Package no-bundle binary
        shell: bash
        run: |
          set -e
          bin="src-tauri/target/release/kansolo"
          [ -f "$bin" ] || bin="src-tauri/target/release/Kansolo"
          dir="no-bundle/${{ matrix.os-label }}-${{ matrix.arch }}"
          mkdir -p "$dir"
          cp "$bin" "$dir/"
          tar czf "kansolo-no-bundle-${{ matrix.os-label }}-${{ matrix.arch }}.tar.gz" -C no-bundle .

      - name: Package bundles
        shell: bash
        run: |
          tar czf "kansolo-bundles-${{ matrix.os-label }}-${{ matrix.arch }}.tar.gz" \
            -C src-tauri/target/release/bundle .

      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: |
            kansolo-no-bundle-*.tar.gz
            kansolo-bundles-*.tar.gz
